name: Build and deploy site
description: Build site data JSON from the DB, build the SPA, deploy to GitHub Pages

outputs:
  page_url:
    description: URL of the deployed GitHub Pages site
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: site/package-lock.json
    - name: Build site data
      shell: bash
      run: .venv/bin/warnlive build-site --out site/public/data
    - name: Build site
      shell: bash
      env:
        SITE_BASE: /warn-notice-register/
      run: |
        cd site && npm ci && npm run build
        cp dist/index.html dist/404.html  # SPA fallback for deep links on Pages
    - name: Configure Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/dist
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
