name: Build and deploy site
description: Build site data JSON from the DB, build the SPA, deploy to Cloudflare Pages

inputs:
  cloudflare-api-token:
    required: true
  cloudflare-account-id:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: site/package-lock.json
    - name: Build site data
      shell: bash
      run: .venv/bin/warnlive build-site --out site/public/data
    - name: Build site
      shell: bash
      run: cd site && npm ci && npm run build
    - name: Deploy to Cloudflare Pages
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
          echo "CLOUDFLARE_API_TOKEN secret not set — skipping deploy."
          exit 0
        fi
        cd site && npx wrangler@4 pages deploy dist --project-name warn-live --branch main
