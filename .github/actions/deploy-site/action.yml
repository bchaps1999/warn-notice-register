name: Build and deploy site
description: Build site data JSON from the DB, build the SPA, deploy to GitHub Pages

outputs:
  page_url:
    description: URL of the deployed GitHub Pages site
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: Check Kansas publication holds
      shell: bash
      run: .venv/bin/warnlive check-kansas-holds
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: site/package-lock.json
    - name: Build site data
      shell: bash
      run: |
        as_of="$(date -u +%F)"
        .venv/bin/warnlive build-site --out site/public/data --as-of "$as_of"
    - name: Reconcile release data
      shell: bash
      run: .venv/bin/python -m warnlive.verify.release --site-data site/public/data
    - name: Build site
      shell: bash
      env:
        SITE_BASE: /warn-notice-register/
      run: |
        export VITE_DATA_VERSION="$(find site/public/data -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)"
        cd site && npm ci && npm test && npm run build
        cp dist/index.html dist/404.html  # SPA fallback for deep links on Pages
    - name: Configure Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/dist
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
