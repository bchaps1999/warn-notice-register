name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: ./install.sh
      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install frontend
        run: npm ci --prefix site
      - name: Test frontend
        run: npm test --prefix site
      - name: Build frontend
        run: npm run build --prefix site
  release-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: ./install.sh
      - name: Replay frozen release sources
        run: |
          echo '858d1493a86f2a8012f2ce50844b316ab36731ee4482987a93893baedc457de7  data/source_snapshots/2026-09-24-agency-only-ny-ga-orhist-txhist-mo-oh-v1.tar.gz' | sha256sum -c -
          .venv/bin/python -m warnlive.migrate.offline_rebuild \
            --bundle data/source_snapshots/2026-09-24-agency-only-ny-ga-orhist-txhist-mo-oh-v1.tar.gz \
            --db "$RUNNER_TEMP/replay.sqlite" --observed-at 2026-09-24 \
            --report "$RUNNER_TEMP/replay-report.json" \
            --exceptions "$RUNNER_TEMP/replay-exceptions.jsonl.gz"
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          import os

          expected = json.loads(Path('data/source_snapshots/2026-09-24-agency-only-ny-ga-orhist-txhist-mo-oh-v1-report.json').read_text())
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'replay-report.json').read_text())
          for key in ('notices', 'versions', 'links', 'workers', 'integrity', 'foreign_key_errors', 'fingerprints'):
              assert actual[key] == expected[key], (key, actual[key], expected[key])
          PY
