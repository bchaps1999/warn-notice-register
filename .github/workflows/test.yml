name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: ./install.sh
      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install frontend
        run: npm ci --prefix site
      - name: Test frontend
        run: npm test --prefix site
      - name: Build frontend
        run: npm run build --prefix site
  release-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: ./install.sh
      - name: Replay frozen release sources
        run: |
          echo '746745a066cb5e3c6ad5fc4263b83b27b3bba4a0d25115d46d78341e1df42070  data/source_snapshots/2026-09-24-strict-ks-ky-source-bundle.tar.gz' | sha256sum -c -
          .venv/bin/python -m warnlive.migrate.offline_rebuild \
            --bundle data/source_snapshots/2026-09-24-strict-ks-ky-source-bundle.tar.gz \
            --db "$RUNNER_TEMP/replay.sqlite" --observed-at 2026-09-24 --source-only \
            --report "$RUNNER_TEMP/replay-report.json" \
            --exceptions "$RUNNER_TEMP/replay-exceptions.jsonl"
          .venv/bin/python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          import os

          expected = json.loads(Path('data/source_snapshots/2026-09-24-strict-ks-ky-candidate-report.json').read_text())
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'replay-report.json').read_text())
          for key in ('notices', 'versions', 'links', 'workers', 'integrity', 'foreign_key_errors', 'fingerprints'):
              assert actual[key] == expected[key], (key, actual[key], expected[key])
          with gzip.open('data/source_snapshots/2026-09-24-strict-ks-ky-candidate.exceptions.jsonl.gz', 'rb') as source:
              expected_exceptions = source.read()
          actual_exceptions = (Path(os.environ['RUNNER_TEMP']) / 'replay-exceptions.jsonl').read_bytes()
          assert actual_exceptions == expected_exceptions, 'exception ledger changed'
          PY
