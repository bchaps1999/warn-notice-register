# GitHub Pages deploy — usable once the repo is public and Pages is enabled
# (Settings -> Pages -> Source: GitHub Actions). Until then, dispatch fails at
# the deploy step, harmlessly. To make Pages the primary host after going
# public: add these build/deploy steps to .github/actions/deploy-site in place
# of the wrangler step, and delete this note.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: ./install.sh
      - name: Unpack database
        run: gunzip -kf data/warn.sqlite.gz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site data
        run: .venv/bin/warnlive build-site --out site/public/data
      - name: Build site (under /warn-live/ subpath)
        run: |
          cd site && npm ci && SITE_BASE=/warn-live/ npm run build
          cp dist/index.html dist/404.html  # SPA fallback on Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
