name: Ad-hoc scrape (manual)

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Space-separated postal codes (e.g. 'ga va')"
        required: true
      smoke:
        description: "Smoke mode (no DB writes/commit)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: ./install.sh
      - name: Install browser deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - uses: browser-actions/setup-chrome@v1
      - name: Unpack database
        run: '[ -f data/warn.sqlite.gz ] && gunzip -kf data/warn.sqlite.gz || true'
      - name: Scrape
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: >
          .venv/bin/warnlive scrape ${{ inputs.states }}
          ${{ inputs.smoke && '--smoke' || '' }} --trigger manual
      - name: Commit data
        if: ${{ !inputs.smoke }}
        run: |
          git config user.name "warn-live bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Ad-hoc scrape $(date -u +%F): ${{ inputs.states }}"
            git pull --rebase origin main
            git push
          fi
