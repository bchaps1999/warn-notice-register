name: Ad-hoc scrape (manual)

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Space-separated postal codes (e.g. 'ga va')"
        required: true
      smoke:
        description: "Smoke mode (no DB writes/commit)"
        type: boolean
        default: true

permissions:
  contents: write

# Same group as the scheduled scrapes: two runners ingesting into diverging
# copies of the same committed database cannot both push.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REQUESTED_STATES: ${{ inputs.states }}
      SMOKE_MODE: ${{ inputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: ./install.sh
      - name: Install browser deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - uses: browser-actions/setup-chrome@v1
      - name: Unpack database
        run: .venv/bin/warnlive unpack-db
      - name: Scrape
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: |
          read -r -a states <<< "$REQUESTED_STATES"
          if (( ${#states[@]} == 0 )); then
            echo "::error::Provide at least one state postal code"
            exit 1
          fi
          for state in "${states[@]}"; do
            if [[ ! "$state" =~ ^[A-Za-z]{2}$ ]]; then
              echo "::error::Invalid state postal code"
              exit 1
            fi
          done
          if [[ "$SMOKE_MODE" == "true" ]]; then
            .venv/bin/warnlive scrape "${states[@]}" --smoke --trigger manual --run-report workdir/reports/current-run.json
          else
            .venv/bin/warnlive scrape "${states[@]}" --trigger manual --run-report workdir/reports/current-run.json
          fi
      - name: Persist newly unresolved Kansas portal rows
        if: ${{ always() && !inputs.smoke }}
        run: |
          if [[ -n "$(git status --porcelain -- data/ks_portal_holds.json)" ]]; then
            git config user.name "warn-register bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/ks_portal_holds.json
            git commit -m "Preserve unresolved Kansas WARN portal rows"
            git push
          fi
      - name: Block publication on source admission conflict
        if: ${{ !inputs.smoke }}
        run: .venv/bin/warnlive check-publication-gate workdir/reports/current-run.json
      - name: Detect revisions/duplicates
        if: ${{ !inputs.smoke }}
        run: .venv/bin/warnlive dupes
      - name: Check for data regressions
        # An ad-hoc run commits to the same main as the scheduled runs; it
        # must clear the same gate, or bad data lands and every subsequent
        # daily fails on it.
        if: ${{ !inputs.smoke }}
        run: .venv/bin/warnlive check-regressions --update-snapshot
      - name: Commit data
        if: ${{ !inputs.smoke }}
        run: |
          git config user.name "warn-register bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Ad-hoc scrape $(date -u +%F): $REQUESTED_STATES"
            # Fail rather than rebase: the DB dump is regenerated whole,
            # so a rebase keeps this runner's copy and silently discards
            # whatever the concurrent commit changed in it. Re-run the
            # workflow to rebuild on top of the moved main.
            git push || { echo "::error::push rejected - main moved during this run; re-run the workflow"; exit 1; }
          fi
      - name: Upload run report and Kansas evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            workdir/reports/current-run.json
            workdir/cache/ks/*.tar.gz
          retention-days: 14
          if-no-files-found: ignore
      - name: Check selected state outcomes
        if: always()
        run: .venv/bin/warnlive check-run-report workdir/reports/current-run.json
