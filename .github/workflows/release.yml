name: Publish release

on:
  push:
    tags:
      - "v1.2.0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify frozen assets
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('data/source_snapshots/2026-09-30-v1.2.0-release-manifest.json').read_text())
          assert manifest['release'] == 'v1.2.0'
          for group in ('input_sha256', 'artifact_sha256'):
              for name, expected in manifest[group].items():
                  contents = Path(name).read_bytes()
                  assert len(contents) == expected['bytes'], name
                  assert hashlib.sha256(contents).hexdigest() == expected['sha256'], name
          evidence_root = Path('data/source_snapshots/2026-09-24-quality-evidence')
          evidence = json.loads((evidence_root / 'manifest.json').read_text())
          for item in evidence['files']:
              contents = (evidence_root / item['path']).read_bytes()
              assert len(contents) == item['size'], item['path']
              assert hashlib.sha256(contents).hexdigest() == item['sha256'], item['path']
          print('Frozen release inputs and artifacts verified')
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            data/source_snapshots/2026-09-30-v1.2-source-bundle.tar.gz \
            data/source_snapshots/2026-09-30-v1.2-candidate-report.json \
            data/source_snapshots/2026-09-30-v1.2-candidate.exceptions.jsonl.gz \
            data/source_snapshots/2026-09-30-v1.2.0-release-manifest.json \
            data/warn.sql.gz \
            --verify-tag \
            --title "WARN Notice Register ${GITHUB_REF_NAME} — entries, addresses, and recovered sources" \
            --notes 'The source-backed register contains 80,703 admitted notices, 95,090 versions, and 8,205,189 reported affected workers. One notice is now one entry the agency lists; site addresses are restored with their basis; Nebraska layoff/closure-report rows move to source observations; Wisconsin 2016-2019, Nebraska 2020-2022 and Nevada 2021 are recovered from official sources. Every v1.1.1 notice key is present, retired or re-keyed through a published transition map, or held by a documented rule. The frozen source bundle, replay report, exception ledger, database dump, and hash manifest are attached. See docs/release-v1.2.0-2026-09-30.md at this tag.'
