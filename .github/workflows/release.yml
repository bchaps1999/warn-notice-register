name: Publish release

on:
  push:
    tags:
      - "v1.1.1"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen assets
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('data/source_snapshots/2026-09-25-quality-release-manifest.json').read_text())
          assert manifest['release'] == 'v1.1.1'
          for group in ('input_sha256', 'artifact_sha256'):
              for name, expected in manifest[group].items():
                  contents = Path(name).read_bytes()
                  assert len(contents) == expected['bytes'], name
                  assert hashlib.sha256(contents).hexdigest() == expected['sha256'], name
          evidence_root = Path('data/source_snapshots/2026-09-24-quality-evidence')
          evidence = json.loads((evidence_root / 'manifest.json').read_text())
          for item in evidence['files']:
              contents = (evidence_root / item['path']).read_bytes()
              assert len(contents) == item['size'], item['path']
              assert hashlib.sha256(contents).hexdigest() == item['sha256'], item['path']
          print('Frozen release inputs and artifacts verified')
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            data/source_snapshots/2026-09-24-strict-ks-ky-source-bundle.tar.gz \
            data/source_snapshots/2026-09-25-quality-candidate-report.json \
            data/source_snapshots/2026-09-25-quality-candidate.exceptions.jsonl.gz \
            data/source_snapshots/2026-09-25-quality-release-manifest.json \
            data/warn.sql.gz \
            --verify-tag \
            --title "WARN Notice Register ${GITHUB_REF_NAME} — notice quality and provenance" \
            --notes 'The source-backed register contains 74,828 admitted notices, 88,748 versions, and 7,815,994 reported affected workers. This release distinguishes affected sites from mailing addresses, separates agency dates from legal notice dates, and adds source locators and quality statuses. The frozen source bundle, replay report, exception ledger, database dump, and hash manifest are attached. See docs/release-v1.1.1-2026-09-25.md at this tag for corrections, reconciliation, and remaining source limits.'
