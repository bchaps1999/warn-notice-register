name: Publish release

on:
  push:
    tags:
      - "v1.3.0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify frozen assets
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('data/source_snapshots/2026-09-30-v1.3.0-release-manifest.json').read_text())
          assert manifest['release'] == 'v1.3.0'
          for group in ('input_sha256', 'artifact_sha256'):
              for name, expected in manifest[group].items():
                  contents = Path(name).read_bytes()
                  assert len(contents) == expected['bytes'], name
                  assert hashlib.sha256(contents).hexdigest() == expected['sha256'], name
          evidence_root = Path('data/source_snapshots/2026-09-24-quality-evidence')
          evidence = json.loads((evidence_root / 'manifest.json').read_text())
          for item in evidence['files']:
              contents = (evidence_root / item['path']).read_bytes()
              assert len(contents) == item['size'], item['path']
              assert hashlib.sha256(contents).hexdigest() == item['sha256'], item['path']
          print('Frozen release inputs and artifacts verified')
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            data/source_snapshots/2026-09-30-v1.3-source-bundle.tar.gz \
            data/source_snapshots/2026-09-30-v1.3-candidate-report.json \
            data/source_snapshots/2026-09-30-v1.3-candidate.exceptions.jsonl.gz \
            data/source_snapshots/2026-09-30-v1.3.0-release-manifest.json \
            data/warn.sql.gz \
            --verify-tag \
            --title "WARN Notice Register ${GITHUB_REF_NAME} — recovered agency history" \
            --notes 'The source-backed register contains 85,810 admitted notices, 100,268 versions, and 8,844,698 reported affected workers: a full replay of the dated v1.3 source bundle (85,688 notices) plus one dated live scrape of the daily states on 2026-09-30. History is recovered from official agency files and archived agency pages for Kentucky 1998-2025, Tennessee 2012-2021, Michigan 2014-2022, Louisiana 2007-2024, Connecticut 2009-2025, Iowa 2005-2018 and Ohio 2023-2025, from the Arizona, Maine, Vermont and Delaware job portals, and 45 Oregon historical rows missing only a date or count (4,985 notices in all). Every v1.2.0 notice is unchanged in the replay. The frozen source bundle, replay report, exception ledger, database dump, and hash manifest are attached. See docs/release-v1.3.0-2026-09-30.md at this tag.'
