name: Daily scrape (high-volume states)

on:
  schedule:
    - cron: "0 9 * * 1-6" # daily except Sunday (the weekly full sweep covers it)
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  actions: write # re-queue this workflow when main moves mid-run
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-24.04
    env:
      # mass.gov refuses GitHub runners; MA falls back to each file's newest
      # 200 Internet Archive capture and records it in ma.fetch_manifest.json.
      WARNLIVE_MA_ARCHIVE_FALLBACK: "1"
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: ./install.sh
      - uses: browser-actions/setup-chrome@v2 # TX needs headless Chrome for the AWS WAF challenge
      - name: Unpack database
        run: .venv/bin/warnlive unpack-db
      - name: Scrape active daily states
        run: .venv/bin/warnlive scrape --cadence daily --trigger scheduled --run-report workdir/reports/current-run.json
      - name: Detect revisions/duplicates
        run: .venv/bin/warnlive dupes
      - name: Check for data regressions
        # Whole-database checks: a parser can ingest the right number of rows
        # with wrong values in them, which per-state verification cannot see.
        # Failing here leaves the repo and the published site untouched.
        run: .venv/bin/warnlive check-regressions --update-snapshot
      - name: Check publication gate
        run: .venv/bin/warnlive check-publication-gate workdir/reports/current-run.json
      - name: Commit data
        run: |
          git config user.name "warn-register bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily scrape $(date -u +%F)"
            # Fail rather than rebase: the DB dump is regenerated whole,
            # so a rebase keeps this runner's copy and silently discards
            # whatever the concurrent commit changed in it. Re-run the
            # workflow to rebuild on top of the moved main.
            # A queued re-run shares the scrape concurrency group, so it
            # starts from the moved main once this run has finished.
            git push || {
              echo "::error::push rejected - main moved during this run; queued a re-run"
              GH_TOKEN="${{ github.token }}" gh workflow run "${{ github.workflow }}" --ref main || true
              exit 1
            }
          fi
      - uses: ./.github/actions/deploy-site
      - name: Sync health issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create state-health --force --color D93F0B --description "Per-state scrape health" || true
          .venv/bin/warnlive report --gh-issues
      - name: Upload raw scrapes + logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-${{ github.run_id }}
          path: |
            workdir/raw/
            workdir/cache/ks/*.tar.gz
            workdir/reports/current-run.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Check selected state outcomes
        if: always()
        run: .venv/bin/warnlive check-run-report workdir/reports/current-run.json
      - name: Alert on failed scheduled run
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: ./.github/actions/scrape-alert
        with:
          outcome: failure
          token: ${{ github.token }}
      - name: Clear failed-run alert
        if: success() && github.event_name != 'pull_request'
        uses: ./.github/actions/scrape-alert
        with:
          outcome: success
          token: ${{ github.token }}
