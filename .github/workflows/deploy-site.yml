name: Deploy site (code changes)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "warnlive/store/site_export.py"
      - ".github/actions/deploy-site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

# Same group as the scrape workflows, which also deploy Pages: two
# concurrent deployments race, and which build wins is timing-dependent.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: ./install.sh
      - name: Unpack database
        run: .venv/bin/warnlive unpack-db
      - uses: ./.github/actions/deploy-site
        id: deploy
