name: Weekly scrape (all active states)

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: scrape # never let two scrape runs commit concurrently
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: ./install.sh
      - name: Install browser deps (VA needs selenium + Xvfb)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - uses: browser-actions/setup-chrome@v1
      - name: Unpack database
        run: '[ -f data/warn.sqlite.gz ] && gunzip -kf data/warn.sqlite.gz || true'
      - name: Scrape all active states
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: .venv/bin/warnlive scrape --cadence weekly --trigger scheduled
      - name: Detect revisions/duplicates
        run: .venv/bin/warnlive dupes
      - name: Commit data
        run: |
          git config user.name "warn-live bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Weekly scrape $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
      - uses: ./.github/actions/deploy-site
      - name: Sync health issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create state-health --force --color D93F0B --description "Per-state scrape health" || true
          .venv/bin/warnlive report --gh-issues || true
      - name: Upload raw scrapes + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: workdir/raw/
          retention-days: 14
          if-no-files-found: ignore
