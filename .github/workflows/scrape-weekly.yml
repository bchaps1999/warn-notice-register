name: Weekly scrape (all active states)

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: scrape # never let two scrape runs commit concurrently
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: ./install.sh
      - name: Install browser deps (VA needs selenium + Xvfb)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - uses: browser-actions/setup-chrome@v1
      - name: Unpack database
        run: .venv/bin/warnlive unpack-db || true
      - name: Scrape all active states
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: .venv/bin/warnlive scrape --cadence weekly --trigger scheduled
      - name: Detect revisions/duplicates
        run: .venv/bin/warnlive dupes
      - name: Rebuild the adjudication queues
        # New notices bring locations no gazetteer places and employers no
        # matcher identifies. Both are found only by rebuilding the review
        # files, so without this a queue is as stale as the last time
        # somebody ran it by hand — and the work never surfaces at all.
        # Reads reference files and the database, calls nothing external;
        # adjudicating what these list stays a manual, offline step.
        run: |
          .venv/bin/warnlive places-refresh --review-only
          .venv/bin/warnlive identity-review
      - name: Check for data regressions
        # Whole-database checks: a parser can ingest the right number of rows
        # with wrong values in them, which per-state verification cannot see.
        # Failing here leaves the repo and the published site untouched.
        run: .venv/bin/warnlive check-regressions --update-snapshot
      - name: Commit data
        run: |
          git config user.name "warn-register bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Weekly scrape $(date -u +%F)"
            # Fail rather than rebase: the DB dump is regenerated whole,
            # so a rebase keeps this runner's copy and silently discards
            # whatever the concurrent commit changed in it. Re-run the
            # workflow to rebuild on top of the moved main.
            git push || { echo "::error::push rejected - main moved during this run; re-run the workflow"; exit 1; }
          fi
      - uses: ./.github/actions/deploy-site
      - name: Sync health issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create state-health --force --color D93F0B --description "Per-state scrape health" || true
          .venv/bin/warnlive report --gh-issues || true
      - name: Upload raw scrapes + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: workdir/raw/
          retention-days: 14
          if-no-files-found: ignore
