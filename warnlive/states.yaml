# WARN state registry — one entry per jurisdiction (47 portal + 4 records-request).
# Seeded from docs/WARN_State_Portal_Catalog.xlsx.
#
# Fields:
#   source: upstream (warn-scraper) | patched (our fetch/patches override) |
#           custom (our fetch/custom adapter) | manual (records-request only)
#   status: unverified | active | broken | manual_only
#     Human-edited. Verification results only *recommend* transitions.
#     Only `active` states' data enters exports; scheduled runs skip broken/manual.
#   tier: easy | medium | hard  (scrape difficulty, from the portal catalog)
#   cadence: daily | weekly     (which scheduled workflow runs it)
#   needs_browser: scraper needs headless Chrome/Xvfb
#   min_rows: verification threshold on all-time raw rows
#   staleness_days: max age of newest notice_date before freshness warns; null = archival/annual source
#   expected_columns: raw CSV header snapshot; null until first verified fetch
#   notes: quirks, upstream issue links

