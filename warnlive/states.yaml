# WARN state registry — one entry per jurisdiction (48 portal + 4 records-request).
# Seeded from docs/WARN_State_Portal_Catalog.xlsx.
#
# Fields:
#   source: upstream (warn-scraper) | patched (our fetch/patches override) |
#           custom (our fetch/custom adapter) | manual (records-request only)
#   status: unverified | active | broken | manual_only | archive
#     Human-edited. Verification results only *recommend* transitions.
#     `active` and `archive` states' data enters exports; scheduled runs skip
#     everything but active (archive = fetch broken but held rows still export).
#   tier: easy | medium | hard  (scrape difficulty, from the portal catalog)
#   cadence: daily | weekly     (which scheduled workflow runs it)
#   needs_browser: scraper needs headless Chrome/Xvfb
#   min_rows: verification threshold on all-time raw rows
#   staleness_days: max age of newest configured source date before freshness warns; null = archival/annual source
#   freshness_field: notice_date (default) | effective_date | source_details.<validated agency date>
#   same_key_policy: versions (default) | distinct_rows — distinct rows of one document that share a
#     legacy dedupe_key stay separate entries instead of folding into versions (normalize/entries.py)
#   fetch_budget_minutes: wall-clock cap on one live fetch (default 45, pipeline.DEFAULT_FETCH_BUDGET_MINUTES); past it the state fails and the run continues
#   expected_columns: raw CSV header snapshot; null until first verified fetch
#   notes: quirks, upstream issue links

