# uiforecast run configuration (single source of truth for a backtest run)
backtest:
  origin_start: 2017-01-01     # first target week
  origin_end: null             # null = latest available target
  lag_quantiles: [0.1, 0.5, 0.9]   # WARN visibility sensitivity (mandatory)
  panel_start: 2013-01-01
  seed: 0

covid:
  # excluded from estimation AND headline scoring; reported separately
  start: 2020-03-07
  end: 2021-06-30

warn:
  sqlite_path: ../data/warn.sqlite       # relative to forecast/
  vintage_epoch: 2026-07-16              # bulk-load date; first_seen <= this has no vintage info
  balanced_min_nonzero: 0.05

gate:
  # pre-registered pass criteria -- do not tune after seeing results
  warn_model: agg_adl
  baseline: ar_nsa
  full_sample: {max_ratio: 0.99, max_dm_p: 0.10}
  event_weeks: {quantile: 0.8, max_ratio: 0.95, max_dm_p: 0.10}
  require_sign_stability_across_lag_q: true
