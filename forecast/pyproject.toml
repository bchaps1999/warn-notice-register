[project]
name = "uiforecast"
version = "0.1.0"
description = "Weekly US initial UI claims nowcasting from WARN notice data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyarrow>=14",
    "requests>=2.31",
    "click>=8.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
uiforecast = "uiforecast.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uiforecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
